<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<script src="/preload.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-overview" data-tab="overview" aria-controls="overview" data-i18n="tab.overview">概览</button>
    <button class="tab" role="tab" id="tab-quota" data-tab="quota" aria-controls="quota" data-i18n="tab.quota">额度</button>
    <button class="tab" role="tab" id="tab-history" data-tab="history" aria-controls="history" data-i18n="tab.history">历史</button>
  </nav>
  <div class="bar-actions">
    <button class="icon-btn" id="refresh" type="button" aria-label="刷新" title="刷新">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
    </button>
    <div class="lang-pill" id="lang" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="zh" aria-pressed="true">中</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<main class="pane" id="overview" role="tabpanel" aria-labelledby="tab-overview"><p class="empty" data-i18n="loading">加载中…</p></main>
<main class="pane" id="quota" role="tabpanel" aria-labelledby="tab-quota" hidden></main>
<main class="pane" id="history" role="tabpanel" aria-labelledby="tab-history" hidden></main>
<script src="app.js"></script>
</body>
</html>
