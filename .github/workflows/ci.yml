name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node 24 checks · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        shell: bash
        run: |
          shopt -s nullglob
          for f in bin/*.mjs scripts/*.mjs sidecars/agy-lens/*.mjs sidecars/agy-lens/lib/*.mjs sidecars/agy-lens/web/*.js sidecars/agy-lens/web/views/*.js; do
            [ -f "$f" ] || continue
            echo "node --check $f"
            node --check "$f"
          done
      - name: Node tests
        shell: bash
        run: node --test tests/*.mjs
      - name: CLI help smoke check
        shell: bash
        run: node bin/cli.mjs --help
      - name: Smoke-test release ZIP build
        shell: bash
        run: node scripts/build-release.mjs
      - name: Validate plugin manifests
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const pj = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
            const rp = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const sc = JSON.parse(fs.readFileSync('sidecars/agy-lens/sidecar.json', 'utf8'));
            const sp = JSON.parse(fs.readFileSync('sidecars/agy-lens/package.json', 'utf8'));
            assert.equal(pj.name, 'agy-lens');
            assert.equal(pj.displayName, 'Agy Lens');
            assert.equal(rp.name, 'agy-lens');
            assert.equal(sc.display_name, 'Agy Lens');
            assert.equal(sp.name, 'agy-lens-panel');
            assert.equal(Object.keys(rp.dependencies || {}).length, 0);
            assert.equal(Object.keys(sp.dependencies || {}).length, 0);
          "
      - name: Check Unix installer dry-run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh --dry-run
          bash scripts/install.sh --dry-run v2.2.0
      - name: Check Windows installer dry-run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $err = $null
          [void][System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw 'scripts/install.ps1'), [ref]$err)
          if ($err.Count -ne 0) { throw "PSParser errors: $($err.Count)" }
          & ./scripts/install.ps1 -DryRun
          & ./scripts/install.ps1 --dry-run 2.2.0
