name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & attach release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        shell: bash
        run: |
          shopt -s nullglob
          for f in bin/*.mjs scripts/*.mjs sidecars/agy-lens/*.mjs sidecars/agy-lens/lib/*.mjs sidecars/agy-lens/web/*.js sidecars/agy-lens/web/views/*.js; do
            [ -f "$f" ] || continue
            echo "node --check $f"
            node --check "$f"
          done
      - name: Run Node tests
        shell: bash
        run: node --test tests/*.mjs
      - name: CLI help smoke check
        shell: bash
        run: node bin/cli.mjs --help
      - name: Validate plugin manifests
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const pj = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
            const rp = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const sc = JSON.parse(fs.readFileSync('sidecars/agy-lens/sidecar.json', 'utf8'));
            const sp = JSON.parse(fs.readFileSync('sidecars/agy-lens/package.json', 'utf8'));
            assert.equal(pj.name, 'agy-lens');
            assert.equal(rp.name, 'agy-lens');
            assert.equal(sc.display_name, 'Agy Lens');
            assert.equal(sp.name, 'agy-lens-panel');
          "
      - name: Build direct-install ZIP
        shell: bash
        run: node scripts/build-release.mjs
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "${TAG} — Agy Lens (agy-lens)" --generate-notes
          fi
