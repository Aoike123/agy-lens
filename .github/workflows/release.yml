name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & attach release ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        shell: bash
        run: |
          shopt -s nullglob
          for f in bin/*.mjs scripts/*.mjs sidecars/agy-lens/*.mjs sidecars/agy-lens/lib/*.mjs sidecars/agy-lens/web/*.js sidecars/agy-lens/web/views/*.js; do
            [ -f "$f" ] || continue
            echo "node --check $f"
            node --check "$f"
          done
      - name: Run Node tests
        shell: bash
        run: node --test tests/*.mjs
      - name: CLI help smoke check
        shell: bash
        run: node bin/cli.mjs --help
      - name: Validate plugin manifests
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const assert = require('node:assert/strict');
            const pj = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
            const rp = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const sc = JSON.parse(fs.readFileSync('sidecars/agy-lens/sidecar.json', 'utf8'));
            const sp = JSON.parse(fs.readFileSync('sidecars/agy-lens/package.json', 'utf8'));
            assert.equal(pj.name, 'agy-lens');
            assert.equal(rp.name, 'agy-lens');
            assert.equal(sc.display_name, 'Agy Lens');
            assert.equal(sp.name, 'agy-lens-panel');
          "
      - name: Build direct-install ZIP
        shell: bash
        run: node scripts/build-release.mjs
      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          node -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            const tag = process.argv[2];
            const cl = fs.readFileSync("CHANGELOG.md", "utf8");
            const linesAll = cl.split(/\r?\n/);
            const header = "## [" + ver + "]";
            const start = linesAll.findIndex((l) => l.startsWith(header));
            let body = "";
            if (start >= 0) {
              const section = [];
              for (let i = start + 1; i < linesAll.length; i += 1) {
                if (/^## \[/.test(linesAll[i]) || /^\[[^\]]+\]:\s*http/.test(linesAll[i])) break;
                section.push(linesAll[i]);
              }
              body = section.join("\n").trim();
            }
            const out = [
              "![Agy Lens](https://raw.githubusercontent.com/Aoike123/agy-lens/" + tag + "/docs/img/hero-en.png)",
              "",
            ];
            if (body) out.push(body, "");
            out.push(
              "## Quick Install",
              "",
              "**Windows (PowerShell):**",
              "```powershell",
              "irm https://raw.githubusercontent.com/Aoike123/agy-lens/main/scripts/install.ps1 | iex",
              "```",
              "",
              "**macOS / Linux:**",
              "```bash",
              "curl -fsSL https://raw.githubusercontent.com/Aoike123/agy-lens/main/scripts/install.sh | bash",
              "```",
              ""
            );
            fs.writeFileSync("/tmp/release-notes.md", out.join("\n"), "utf8");
          ' "$VER" "$TAG"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -s /tmp/release-notes.md ]; then
            gh release create "$TAG" dist/* --title "${TAG} — Agy Lens (agy-lens)" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" dist/* --title "${TAG} — Agy Lens (agy-lens)" --generate-notes
          fi
